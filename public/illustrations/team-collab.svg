<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="teamPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8A6FF" />
      <stop offset="100%" stop-color="#7B61FF" />
    </linearGradient>
    <linearGradient id="teamGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE58F" />
      <stop offset="100%" stop-color="#D5B45C" />
    </linearGradient>
    <filter id="teamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow circles -->
  <circle cx="300" cy="200" r="140" fill="#B8A6FF" opacity="0.08" filter="url(#teamGlow)" />
  <circle cx="210" cy="170" r="100" fill="#D5B45C" opacity="0.08" filter="url(#teamGlow)" />

  <!-- Dotted connectivity web linking teammates -->
  <g opacity="0.4" stroke-dasharray="3 5" stroke-width="1.5">
    <line x1="170" y1="180" x2="300" y2="130" stroke="#B8A6FF" />
    <line x1="300" y1="130" x2="430" y2="180" stroke="#D5B45C" />
    <line x1="170" y1="180" x2="300" y2="280" stroke="#D5B45C" />
    <line x1="430" y1="180" x2="300" y2="280" stroke="#B8A6FF" />
  </g>

  <!-- Central SFSU Gator Shield / Unity Crest -->
  <g transform="translate(255, 90)">
    <circle cx="45" cy="45" r="42" fill="#1D202A" stroke="url(#teamGold)" stroke-width="2.5" filter="url(#teamGlow)" />
    <!-- SFSU Purple & Gold stylized monogram / diamond -->
    <polygon points="45,22 65,45 45,68 25,45" fill="none" stroke="#B8A6FF" stroke-width="2" />
    <circle cx="45" cy="45" r="9" fill="url(#teamGold)" />
    <!-- Mini sparkling stars -->
    <path d="M45 10 L47 16 L53 18 L47 20 L45 26 L43 20 L37 18 L43 16 Z" fill="#D5B45C" />
  </g>

  <!-- Teammate 1 (Left - Ammar / Lead) -->
  <g transform="translate(90, 180)">
    <circle cx="60" cy="50" r="32" fill="#1D202A" stroke="#B8A6FF" stroke-width="2" filter="url(#teamGlow)" />
    <circle cx="60" cy="38" r="14" fill="#ED9DA0" />
    <path d="M46 36 C46 25, 74 25, 74 36 C74 38, 70 41, 70 41 C67 37, 53 37, 50 41 Z" fill="#2E283F" />
    <path d="M38 72 C38 56, 50 50, 60 50 C70 50, 82 56, 82 72 Z" fill="#3A3F4E" />
    <!-- Floating Skill Pill: Next.js -->
    <rect x="22" y="90" width="76" height="22" rx="11" fill="#171A23" stroke="#B8A6FF" stroke-width="1.5" />
    <text x="60" y="105" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#B8A6FF" text-anchor="middle">⚡ Next.js</text>
  </g>

  <!-- Teammate 2 (Center - Divij / AI Lead) -->
  <g transform="translate(240, 230)">
    <circle cx="60" cy="50" r="36" fill="#1D202A" stroke="url(#teamGold)" stroke-width="2.5" filter="url(#teamGlow)" />
    <circle cx="60" cy="36" r="15" fill="#ED9DA0" />
    <path d="M45 34 C45 22, 75 22, 75 34 C75 37, 71 40, 71 40 C67 35, 53 35, 49 40 Z" fill="#1A1824" />
    <!-- Glasses -->
    <rect x="49" y="33" width="9" height="7" rx="2" fill="none" stroke="#D5B45C" stroke-width="1.5" />
    <rect x="62" y="33" width="9" height="7" rx="2" fill="none" stroke="#D5B45C" stroke-width="1.5" />
    <line x1="58" y1="36" x2="62" y2="36" stroke="#D5B45C" stroke-width="1.5" />
    <path d="M36 76 C36 58, 48 52, 60 52 C72 52, 84 58, 84 76 Z" fill="#2A2E39" />
    <!-- Floating Skill Pill: Gemini AI -->
    <rect x="18" y="95" width="84" height="22" rx="11" fill="#171A23" stroke="#D5B45C" stroke-width="1.5" />
    <text x="60" y="110" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#D5B45C" text-anchor="middle">✨ Gemini AI</text>
  </g>

  <!-- Teammate 3 (Right - Oscar / Scheduling) -->
  <g transform="translate(390, 180)">
    <circle cx="60" cy="50" r="32" fill="#1D202A" stroke="#B8A6FF" stroke-width="2" filter="url(#teamGlow)" />
    <circle cx="60" cy="38" r="14" fill="#ED9DA0" />
    <path d="M46 34 C46 23, 74 23, 74 34 C74 37, 68 40, 68 40 C65 36, 55 36, 52 40 Z" fill="#423B52" />
    <path d="M38 72 C38 56, 50 50, 60 50 C70 50, 82 56, 82 72 Z" fill="#3A3F4E" />
    <!-- Floating Skill Pill: Calendar -->
    <rect x="20" y="90" width="80" height="22" rx="11" fill="#171A23" stroke="#B8A6FF" stroke-width="1.5" />
    <text x="60" y="105" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#B8A6FF" text-anchor="middle">🗓️ Schedule</text>
  </g>

  <!-- Floating Achievement / High-Five Stars -->
  <g transform="translate(200, 150)">
    <polygon points="12,2 15,9 22,10 17,15 18,22 12,18 6,22 7,15 2,10 9,9" fill="#D5B45C" />
  </g>
  <g transform="translate(370, 140)">
    <polygon points="10,2 12,8 18,9 14,13 15,19 10,16 5,19 6,13 2,9 8,8" fill="#B8A6FF" />
  </g>

  <!-- Bottom Team Banner / Card -->
  <g transform="translate(150, 370)">
    <rect width="300" height="42" rx="16" fill="#171A23" stroke="#2A2E39" stroke-width="1.5" />
    <circle cx="28" cy="21" r="9" fill="#10B981" opacity="0.2" />
    <circle cx="28" cy="21" r="4.5" fill="#10B981" />
    <text x="48" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#F5F2FA">SFSU Team Assembled &amp; Ready</text>
    <rect x="235" y="11" width="50" height="20" rx="10" fill="#2A2E39" />
    <text x="260" y="24" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#D5B45C" text-anchor="middle">4/4 Online</text>
  </g>
</svg>
