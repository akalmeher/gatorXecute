<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="planGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8A6FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#D5B45C" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D202A" />
      <stop offset="100%" stop-color="#171A23" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background decorative tech circles & grid lines -->
  <g opacity="0.35">
    <circle cx="300" cy="225" r="170" fill="none" stroke="#2A2E39" stroke-width="1.5" stroke-dasharray="4 6" />
    <circle cx="300" cy="225" r="215" fill="none" stroke="#B8A6FF" stroke-width="1" stroke-dasharray="2 8" opacity="0.4" />
    <line x1="80" y1="225" x2="520" y2="225" stroke="#2A2E39" stroke-width="1" stroke-dasharray="3 5" />
    <line x1="300" y1="40" x2="300" y2="410" stroke="#2A2E39" stroke-width="1" stroke-dasharray="3 5" />
  </g>

  <!-- Ambient light blobs -->
  <circle cx="380" cy="160" r="90" fill="#B8A6FF" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="190" cy="260" r="80" fill="#D5B45C" opacity="0.1" filter="url(#softGlow)" />

  <!-- Floating Project Roadmap Canvas / Whiteboard -->
  <rect x="140" y="80" width="320" height="230" rx="20" fill="url(#cardGrad)" stroke="#2A2E39" stroke-width="2" />
  <rect x="140" y="80" width="320" height="38" rx="20" fill="#232733" />
  <rect x="140" y="106" width="320" height="12" fill="#232733" />

  <!-- Window controls -->
  <circle cx="165" cy="99" r="4.5" fill="#EF4444" opacity="0.8" />
  <circle cx="180" cy="99" r="4.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="195" cy="99" r="4.5" fill="#10B981" opacity="0.8" />
  <rect x="230" y="94" width="130" height="10" rx="5" fill="#2A2E39" />

  <!-- Timeline nodes & steps on whiteboard -->
  <line x1="180" y1="160" x2="420" y2="160" stroke="#2A2E39" stroke-width="3" stroke-linecap="round" />
  <line x1="180" y1="160" x2="330" y2="160" stroke="url(#planGrad1)" stroke-width="3" stroke-linecap="round" />

  <!-- Step 1: Research (Done) -->
  <circle cx="180" cy="160" r="14" fill="#B8A6FF" />
  <circle cx="180" cy="160" r="6" fill="#0F1117" />
  <rect x="155" y="185" width="50" height="8" rx="4" fill="#F5F2FA" opacity="0.9" />
  <rect x="162" y="198" width="36" height="5" rx="2.5" fill="#AAA5B4" opacity="0.6" />

  <!-- Step 2: Architecture & Figma (In progress) -->
  <circle cx="260" cy="160" r="15" fill="#D5B45C" filter="url(#softGlow)" />
  <circle cx="260" cy="160" r="7" fill="#0F1117" />
  <rect x="235" y="185" width="52" height="8" rx="4" fill="#D5B45C" />
  <rect x="240" y="198" width="42" height="5" rx="2.5" fill="#AAA5B4" opacity="0.6" />

  <!-- Step 3: Frontend & APIs (Ready) -->
  <circle cx="340" cy="160" r="13" fill="#2A2E39" stroke="#B8A6FF" stroke-width="2" />
  <circle cx="340" cy="160" r="4" fill="#B8A6FF" />
  <rect x="315" y="185" width="50" height="8" rx="4" fill="#F5F2FA" opacity="0.7" />
  <rect x="322" y="198" width="36" height="5" rx="2.5" fill="#AAA5B4" opacity="0.6" />

  <!-- Step 4: Final Milestone (Star) -->
  <circle cx="420" cy="160" r="13" fill="#2A2E39" stroke="#D5B45C" stroke-width="2" />
  <polygon points="420,154 422,159 427,159 423,162 425,167 420,164 415,167 417,162 413,159 418,159" fill="#D5B45C" />
  <rect x="395" y="185" width="50" height="8" rx="4" fill="#F5F2FA" opacity="0.7" />
  <rect x="402" y="198" width="36" height="5" rx="2.5" fill="#D5B45C" opacity="0.8" />

  <!-- Mini Progress Bar below steps -->
  <rect x="180" y="235" width="240" height="12" rx="6" fill="#232733" />
  <rect x="180" y="235" width="165" height="12" rx="6" fill="url(#planGrad1)" />
  <circle cx="345" cy="241" r="5" fill="#F5F2FA" />

  <!-- Floating AI Badge / Chip on Left -->
  <g transform="translate(70, 140)">
    <rect width="105" height="60" rx="14" fill="#1D202A" stroke="#B8A6FF" stroke-width="1.5" filter="url(#softGlow)" opacity="0.95" />
    <circle cx="24" cy="24" r="10" fill="#B8A6FF" opacity="0.2" />
    <path d="M24 18 L26 22 L30 24 L26 26 L24 30 L22 26 L18 24 L22 22 Z" fill="#B8A6FF" />
    <rect x="42" y="18" width="48" height="7" rx="3.5" fill="#F5F2FA" />
    <rect x="42" y="29" width="34" height="5" rx="2.5" fill="#B8A6FF" opacity="0.8" />
    <rect x="16" y="44" width="74" height="4" rx="2" fill="#2A2E39" />
  </g>

  <!-- Floating Task Card on Right with Avatar -->
  <g transform="translate(425, 200)">
    <rect width="125" height="72" rx="14" fill="#1D202A" stroke="#D5B45C" stroke-width="1.5" filter="url(#softGlow)" opacity="0.95" />
    <circle cx="26" cy="26" r="11" fill="url(#goldGrad1)" />
    <text x="26" y="30" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0F1117" text-anchor="middle">DA</text>
    <rect x="46" y="20" width="62" height="7" rx="3.5" fill="#F5F2FA" />
    <rect x="46" y="31" width="44" height="5" rx="2.5" fill="#D5B45C" />
    <rect x="16" y="49" width="40" height="12" rx="6" fill="#232733" />
    <text x="36" y="58" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#AAA5B4" text-anchor="middle">Doing</text>
    <circle cx="106" cy="55" r="5" fill="#10B981" />
  </g>

  <!-- Two Collaborative Student Silhouettes in Foreground -->
  <!-- Student Left (Reviewing with Laptop) -->
  <g transform="translate(130, 270)">
    <!-- Body -->
    <path d="M25 80 C25 50, 45 42, 60 40 C75 42, 95 50, 95 80 Z" fill="#2A2E39" />
    <!-- Collar / Shirt -->
    <path d="M50 40 L60 55 L70 40 Z" fill="#B8A6FF" />
    <!-- Neck & Head -->
    <rect x="54" y="26" width="12" height="15" rx="3" fill="#ED9DA0" />
    <circle cx="60" cy="18" r="16" fill="#ED9DA0" />
    <!-- Hair -->
    <path d="M44 16 C44 4, 76 4, 76 16 C76 19, 72 23, 72 23 C68 18, 52 18, 48 23 Z" fill="#4B465C" />
    <!-- Laptop -->
    <polygon points="50,65 110,65 102,78 42,78" fill="#3A3F4E" />
    <polygon points="55,38 105,38 110,65 50,65" fill="#1D202A" stroke="#B8A6FF" stroke-width="1.5" />
    <circle cx="80" cy="51" r="5" fill="#B8A6FF" opacity="0.8" />
  </g>

  <!-- Student Right (Pointing & Brainstorming) -->
  <g transform="translate(370, 260)">
    <!-- Body -->
    <path d="M25 90 C25 60, 45 52, 60 50 C75 52, 95 60, 95 90 Z" fill="#3A3F4E" />
    <!-- Sweater -->
    <path d="M48 50 L60 66 L72 50 Z" fill="#D5B45C" />
    <!-- Neck & Head -->
    <rect x="54" y="34" width="12" height="16" rx="3" fill="#ED9DA0" />
    <circle cx="60" cy="24" r="16" fill="#ED9DA0" />
    <!-- Hair with Top-knot/curls -->
    <circle cx="60" cy="7" r="6" fill="#1E1B2E" />
    <path d="M44 22 C44 9, 76 9, 76 22 C76 25, 73 28, 73 28 C68 22, 52 22, 47 28 Z" fill="#1E1B2E" />
    <!-- Arm pointing up to milestone -->
    <path d="M35 60 Q10 40 5 15" fill="none" stroke="#ED9DA0" stroke-width="7" stroke-linecap="round" />
    <!-- Idea sparkle from finger -->
    <path d="M5 5 L7 10 L12 12 L7 14 L5 19 L3 14 L-2 12 L3 10 Z" fill="#D5B45C" filter="url(#softGlow)" />
  </g>

  <!-- Desk & Base Horizon -->
  <line x1="60" y1="355" x2="540" y2="355" stroke="#2A2E39" stroke-width="2" />
  <rect x="180" y="356" width="240" height="2" fill="#B8A6FF" opacity="0.4" />
</svg>
