<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="kanbanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#D5B45C" />
    </linearGradient>
    <linearGradient id="kanbanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8A6FF" />
      <stop offset="100%" stop-color="#8054FF" />
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="360" cy="200" r="130" fill="#B8A6FF" opacity="0.08" filter="url(#cardGlow)" />
  <circle cx="210" cy="160" r="100" fill="#D5B45C" opacity="0.07" filter="url(#cardGlow)" />

  <!-- Board Outline Container -->
  <rect x="50" y="60" width="500" height="310" rx="20" fill="#171A23" stroke="#2A2E39" stroke-width="2" />
  
  <!-- Board Top Header -->
  <rect x="50" y="60" width="500" height="48" rx="20" fill="#1D202A" />
  <rect x="50" y="88" width="500" height="20" fill="#1D202A" />
  <line x1="50" y1="108" x2="550" y2="108" stroke="#2A2E39" stroke-width="1.5" />

  <!-- Header Items -->
  <circle cx="78" cy="84" r="6" fill="#D5B45C" />
  <text x="94" y="88" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#F5F2FA">CSC 648 Sprint Board</text>
  <rect x="420" y="73" width="105" height="22" rx="11" fill="#232733" stroke="#2A2E39" />
  <circle cx="435" cy="84" r="4" fill="#10B981" />
  <text x="472" y="88" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#F5F2FA" text-anchor="middle">Active Sprint</text>

  <!-- Three Columns: To Do, In Progress, Done -->
  
  <!-- Column 1: Ready / To Do (Left) -->
  <g transform="translate(75, 125)">
    <rect width="135" height="225" rx="12" fill="#1D202A" stroke="#2A2E39" stroke-width="1" />
    <circle cx="16" cy="18" r="4.5" fill="#AAA5B4" />
    <text x="28" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#AAA5B4">TO DO</text>
    <rect x="100" y="10" width="20" height="15" rx="7.5" fill="#232733" />
    <text x="110" y="21" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#AAA5B4" text-anchor="middle">2</text>

    <!-- Card 1 -->
    <rect x="10" y="36" width="115" height="60" rx="8" fill="#171A23" stroke="#2A2E39" />
    <rect x="18" y="46" width="70" height="7" rx="3.5" fill="#F5F2FA" opacity="0.9" />
    <rect x="18" y="58" width="50" height="5" rx="2.5" fill="#AAA5B4" opacity="0.6" />
    <rect x="18" y="72" width="40" height="14" rx="7" fill="#232733" />
    <text x="38" y="82" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#B8A6FF" text-anchor="middle">Docs</text>
    <circle cx="112" cy="79" r="7" fill="#2A2E39" />
    <text x="112" y="82" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#AAA5B4" text-anchor="middle">SR</text>

    <!-- Card 2 -->
    <rect x="10" y="106" width="115" height="54" rx="8" fill="#171A23" stroke="#2A2E39" />
    <rect x="18" y="116" width="60" height="7" rx="3.5" fill="#F5F2FA" opacity="0.9" />
    <rect x="18" y="128" width="40" height="5" rx="2.5" fill="#AAA5B4" opacity="0.6" />
    <circle cx="112" cy="144" r="7" fill="#2A2E39" />
    <text x="112" y="147" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#AAA5B4" text-anchor="middle">OG</text>
  </g>

  <!-- Column 2: In Progress / Working (Center - Highlighted) -->
  <g transform="translate(230, 125)">
    <rect width="140" height="225" rx="12" fill="#1D202A" stroke="#B8A6FF" stroke-width="1.5" filter="url(#cardGlow)" />
    <circle cx="16" cy="18" r="4.5" fill="#B8A6FF" />
    <text x="28" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#B8A6FF">IN PROGRESS</text>
    <rect x="105" y="10" width="20" height="15" rx="7.5" fill="#B8A6FF" opacity="0.2" />
    <text x="115" y="21" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#B8A6FF" text-anchor="middle">1</text>

    <!-- Card Active (Lifted / Golden Accent) -->
    <g transform="translate(10, 36)">
      <rect width="120" height="85" rx="10" fill="#232733" stroke="url(#kanbanGold)" stroke-width="2" filter="url(#cardGlow)" />
      <rect x="10" y="12" width="75" height="8" rx="4" fill="#F5F2FA" />
      <rect x="10" y="25" width="55" height="6" rx="3" fill="#D5B45C" />
      <!-- Mini Progress Meter -->
      <rect x="10" y="40" width="100" height="6" rx="3" fill="#171A23" />
      <rect x="10" y="40" width="75" height="6" rx="3" fill="url(#kanbanGold)" />
      <!-- Tag & Assignee -->
      <rect x="10" y="58" width="45" height="16" rx="8" fill="#171A23" stroke="#D5B45C" stroke-width="1" />
      <text x="32" y="69" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#D5B45C" text-anchor="middle">⚡ AI API</text>
      <!-- Avatar Badge -->
      <circle cx="104" cy="66" r="9" fill="url(#kanbanGold)" />
      <text x="104" y="70" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#0F1117" text-anchor="middle">DA</text>
    </g>
  </g>

  <!-- Column 3: Done (Right) -->
  <g transform="translate(390, 125)">
    <rect width="135" height="225" rx="12" fill="#1D202A" stroke="#2A2E39" stroke-width="1" />
    <circle cx="16" cy="18" r="4.5" fill="#10B981" />
    <text x="28" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#10B981">DONE</text>
    <rect x="100" y="10" width="20" height="15" rx="7.5" fill="#10B981" opacity="0.2" />
    <text x="110" y="21" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#10B981" text-anchor="middle">3</text>

    <!-- Done Card 1 -->
    <rect x="10" y="36" width="115" height="54" rx="8" fill="#171A23" stroke="#2A2E39" opacity="0.85" />
    <circle cx="22" cy="50" r="5" fill="#10B981" />
    <text x="22" y="53" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#0F1117" text-anchor="middle">✓</text>
    <rect x="34" y="46" width="55" height="6" rx="3" fill="#AAA5B4" />
    <circle cx="112" cy="74" r="7" fill="#2A2E39" />
    <text x="112" y="77" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#AAA5B4" text-anchor="middle">AA</text>

    <!-- Done Card 2 -->
    <rect x="10" y="100" width="115" height="54" rx="8" fill="#171A23" stroke="#2A2E39" opacity="0.85" />
    <circle cx="22" cy="114" r="5" fill="#10B981" />
    <text x="22" y="117" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#0F1117" text-anchor="middle">✓</text>
    <rect x="34" y="110" width="65" height="6" rx="3" fill="#AAA5B4" />
    <circle cx="112" cy="138" r="7" fill="#2A2E39" />
    <text x="112" y="141" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#AAA5B4" text-anchor="middle">DA</text>
  </g>

  <!-- Sparkles around the board -->
  <polygon points="530,95 532,100 537,100 533,103 535,108 530,105 525,108 527,103 523,100 528,100" fill="#D5B45C" />
  <polygon points="70,390 72,395 77,395 73,398 75,403 70,400 65,403 67,398 63,395 68,395" fill="#B8A6FF" />
</svg>
